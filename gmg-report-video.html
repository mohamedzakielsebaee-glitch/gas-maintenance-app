<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>GMG – التقرير المتحرك</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b1a;--amb:#f5a524;--blu:#3b82f6;--mut:#9fb0d0}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;overflow:hidden;font-family:Tajawal,Tahoma,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--bg);overflow:hidden;color:#fff}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 160px 0;background:radial-gradient(900px 600px at 20% 30%,#1d3a8a66,transparent 70%),radial-gradient(800px 600px at 85% 85%,#f5a52422,transparent 70%),var(--bg)}
.scene.on{opacity:1}.a{opacity:0}.on .a{animation:up .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.g{background:linear-gradient(90deg,var(--amb),#ffd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{border:2px solid var(--amb);color:var(--amb);font-weight:700;font-size:30px;padding:6px 26px;border-radius:40px}
h1{font-size:120px;font-weight:800;line-height:1.2;margin:30px 0 20px}h2{font-size:84px;font-weight:800;margin:24px 0 10px}.sub{font-size:44px;color:#d6e0f5}
.lg{display:flex;align-items:center;gap:18px;direction:ltr}.lg b{font-weight:800;letter-spacing:5px}.lg small{display:block;font-size:17px;letter-spacing:3px;color:var(--mut);margin-top:6px}
.top{position:absolute;top:44px;left:70px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;width:1600px;margin-top:60px}
.k{background:linear-gradient(160deg,#122050,#0b1434);border:1.5px solid #2c3f7e;border-radius:30px;padding:46px 30px}
.k .v{font-size:130px;font-weight:800;color:var(--amb);line-height:1}.k .l{font-size:38px;color:#dbe5fa;margin-top:16px}
.bars{width:1400px;margin-top:50px;text-align:right}.br{display:flex;align-items:center;gap:26px;margin:20px 0}
.br .n{width:520px;font-size:38px;font-weight:700}.br .t{flex:1;height:34px;background:#14214a;border-radius:20px;overflow:hidden;direction:ltr}
.br .f{height:100%;background:linear-gradient(90deg,var(--blu),var(--amb));border-radius:20px;width:0}.on .f{transition:width 1.6s var(--d,.6s) cubic-bezier(.2,.8,.2,1);width:var(--w)}
.br .c{width:90px;font-size:44px;font-weight:800;color:var(--amb)}
#bar{position:absolute;bottom:0;right:0;height:6px;background:linear-gradient(270deg,var(--amb),var(--blu));width:0}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:700 40px Tajawal,sans-serif;background:#060b1a;z-index:9}
</style></head><body><div id="msg">جارٍ تحميل البيانات…</div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a9f"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#f26a1b"/></linearGradient></defs></svg>
<div id="stage"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import{getFirestore,collection,getDocs,doc,getDoc,query,where}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
const firebaseConfig = {
            apiKey: "AIzaSyCnCxBurG8x82dgCLIbps-3yUk9P7FgK6k",
            authDomain: "gas-maintenance-app.firebaseapp.com",
            projectId: "gas-maintenance-app",
            storageBucket: "gas-maintenance-app.firebasestorage.app",
            messagingSenderId: "712614942966",
            appId: "1:712614942966:web:5160b841b594d605a974d7",
            measurementId: "G-TXW9XH9QS9"
        };
const APP="gas-maintenance-group-v9",Q=new URLSearchParams(location.search),DAYS=+Q.get("days")||30,DEMO=Q.has("demo");
const logo=(s,sm=1)=>`<div class="lg"><svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 2 57.5 16.5v31L32 62 6.5 47.5v-31z" fill="url(#lb)"/><path d="M32 7.5 52.7 19.3v25.4L32 56.5 11.3 44.7V19.3z" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.4"/><path d="M32 13c1 7 12 13 12 25a12 12 0 0 1-24 0c0-6 3-10 6-13 0 4 2 6 4.5 6.5C29 24 29 18 32 13z" fill="#fff"/><path d="M32 32c3 3.5 6.5 6 6.5 10a6.5 6.5 0 0 1-13 0c0-3 1.5-5 3.2-6.5.5 2 1.500 2.700 2.600 2.800-.6-2.700.4-4.700.7-6.300z" fill="url(#ga)"/></svg>${sm?`<div><b style="font-size:${s*.62}px">GMG</b><small>GAS MAINTENANCE GROUP</small></div>`:`<b style="font-size:${s*.62}px">GMG</b>`}</div>`;
const ar=n=>Number(n).toLocaleString("ar-EG"),fmtD=ms=>{const h=ms/36e5;return h<1?ar(Math.round(h*60))+" دقيقة":ar(h.toFixed(1))+" ساعة"};
async function load(){
 if(DEMO)return{alerts:[...Array(14)].map((_,i)=>({equipName:["Compressor 1 (Ingersoll)","Compressor 3 (Atlas Copco)","Compressor 1 (Boge)"][i%3==0?0:i%3],status:i<12?"closed":"open",date:"2026-10-01T08:00:00Z",resolvedDate:i<12?"2026-10-01T"+(9+i%4)+":00:00Z":""})),inv:[{name:"فلتر هواء كمبرسور",qty:2,minQty:3,unit:"قطعة"},{name:"زيت ضواغط ISO VG 46",qty:35,minQty:40,unit:"لتر"}]};
 const app=initializeApp(firebaseConfig),db=getFirestore(app);try{await signInAnonymously(getAuth(app))}catch(e){}
 const since=new Date(Date.now()-DAYS*864e5).toISOString(),R=["artifacts",APP,"public","data"];
 const s=await getDocs(query(collection(db,...R,"alerts"),where("date",">=",since)));
 const iv=await getDoc(doc(db,...R,"cfg","inventory"));
 return{alerts:s.docs.map(d=>d.data()),inv:iv.exists()?(iv.data().items||[]):[]}}
let D;try{D=await load()}catch(e){document.getElementById("msg").textContent="تعذّر تحميل البيانات: "+(e.message||e);throw e}
document.getElementById("msg").remove();
const A=D.alerts,closed=A.filter(a=>a.status!=="open"&&a.resolvedDate),open=A.length-closed.length;
const dt=closed.map(a=>new Date(a.resolvedDate)-new Date(a.date)).filter(x=>x>0),avg=dt.length?dt.reduce((x,y)=>x+y)/dt.length:0,tot=dt.reduce((x,y)=>x+y,0);
const by={};A.forEach(a=>{const n=a.equipName||"—";by[n]=(by[n]||0)+1});
const top=Object.entries(by).sort((x,y)=>y[1]-x[1]).slice(0,5),mx=top.length?top[0][1]:1;
const low=D.inv.filter(i=>Number(i.qty)<=Number(i.minQty)).slice(0,5);
const now=new Date().toLocaleDateString("ar-SA",{year:"numeric",month:"long",day:"numeric"});
const per=DAYS===7?"الأسبوعي":DAYS===30?"الشهري":"لآخر "+ar(DAYS)+" يوماً";
const card=(v,l,d)=>`<div class="k a" style="--d:${d}s"><div class="v">${ar(v)}</div><div class="l">${l}</div></div>`;
const S=[
{d:8,h:`<div class="a">${logo(120)}</div><h1 class="a" style="--d:.4s">التقرير ${per}<br><span class="g">للصيانة</span></h1><p class="sub a" style="--d:.9s">${now}</p>`},
{d:11,h:`<span class="tag a">مؤشرات الأداء</span><h2 class="a" style="--d:.2s">حصيلة <span class="g">الفترة</span></h2><div class="kp">${card(A.length,"إجمالي البلاغات",.6)}${card(closed.length,"بلاغات مغلقة",1)}${card(open,"بلاغات مفتوحة",1.4)}</div><p class="sub a" style="--d:2s;margin-top:50px">${dt.length?`متوسط مدة الإصلاح: <span class="g">${fmtD(avg)}</span> · إجمالي التوقف: <span class="g">${fmtD(tot)}</span>`:"لا توجد بلاغات مغلقة في هذه الفترة"}</p>`},
{d:11,h:`<span class="tag a">المعدّات</span><h2 class="a" style="--d:.2s">الأكثر <span class="g">بلاغاً</span></h2><div class="bars">${top.length?top.map(([n,c],i)=>`<div class="br a" style="--d:${.5+i*.3}s"><div class="n">${n}</div><div class="t"><div class="f" style="--w:${c/mx*100}%;--d:${.8+i*.3}s"></div></div><div class="c">${ar(c)}</div></div>`).join(""):'<p class="sub">لا توجد بلاغات</p>'}</div>`},
{d:10,h:`<span class="tag a">المخزون</span><h2 class="a" style="--d:.2s">${low.length?'أصناف بلغت <span class="g">الحد الأدنى</span>':'المخزون في <span class="g">المستوى الآمن</span>'}</h2><div class="bars">${low.map((x,i)=>`<div class="br a" style="--d:${.6+i*.3}s"><div class="n">${x.name}</div><div class="c" style="width:auto;margin-right:auto">${ar(x.qty)} ${x.unit||""} <small style="font-size:28px;color:var(--mut)">(الحد الأدنى ${ar(x.minQty)})</small></div></div>`).join("")}</div>`},
{d:8,h:`<div class="a">${logo(150)}</div><h2 class="a" style="--d:.6s;font-size:100px;margin-top:40px">صيانة أذكى، <span class="g">أداء أعلى</span></h2>`}
];
const st=document.getElementById("stage");
st.innerHTML=S.map((s,k)=>`<div class="scene">${s.h}${k&&k<S.length-1?`<div class="top">${logo(44,0)}</div>`:""}</div>`).join("")+'<div id="bar"></div>';
const sc=[...st.querySelectorAll(".scene")],bar=document.getElementById("bar");let i=-1,t;
function go(n){clearTimeout(t);sc.forEach(e=>e.classList.remove("on"));i=n%S.length;const e=sc[i];void e.offsetWidth;e.classList.add("on");
bar.style.transition="none";bar.style.width="0";void bar.offsetWidth;bar.style.transition=`width ${S[i].d}s linear`;bar.style.width="1920px";
t=setTimeout(()=>{if(i<S.length-1)go(i+1)},S[i].d*1000)}
const fit=()=>st.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;addEventListener("resize",fit);fit();
addEventListener("keydown",e=>{if(e.key==="r"||e.key==="R")go(0);if(e.key==="f"||e.key==="F")document.documentElement.requestFullscreen()});
go(0);
</script></body></html>
